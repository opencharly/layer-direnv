direnv:
    candy:
        description: |
            direnv — automatic per-directory environment loading from .envrc files
            direnv installs the `direnv` binary (one package name across
            fedora/arch/debian) AND declaratively wires the per-shell hook that
            makes .envrc autoload work. The shell: schema below emits that hook
            VENUE-SHAPED: at `charly box build` it bakes drop-ins into the image —
            /etc/profile.d/charly-direnv-<shell>.sh for bash/zsh (the generic body
            `eval "$(direnv hook <shell>)"` with ${SHELL_NAME} substituted) and
            the fish-specific hook into /etc/fish/conf.d/charly-direnv.fish
            (`direnv hook fish | source`) — while a `target: local` / `target: vm`
            deploy instead appends managed blocks to ~/.bashrc / ~/.zshrc and
            writes the per-user ~/.config/fish/conf.d/charly-direnv.fish.
            `sh` is intentionally opted OUT (`sh: {}`): upstream `direnv hook`
            supports bash/zsh/fish/tcsh but NOT `sh`, so `direnv hook sh` errors
            on every shell that sources it. The scenarios assert the
            installed/runnable binary in every venue, the baked drop-ins at
            `context: [build]`, and the deploy venue's OWN wiring at
            `context: [runtime]` — so a missing package, a missing shell wiring on
            EITHER venue, or a shipped `sh` hook fails.
        package:
            - direnv
        # Shell hooks installed declaratively via the shell: schema (2026-05).
        # bash/zsh use the POSIX-style hook `eval "$(direnv hook X)"` — handled
        # by the generic body with ${SHELL_NAME} substituted at install time.
        # fish uses different syntax, so it gets a per-shell override.
        # sh is opted OUT: `direnv hook sh` is NOT a valid direnv target (its
        # supported shells are bash/zsh/fish/tcsh), so an empty `sh: {}` override
        # skips the sh drop-in entirely (empty per-shell block → shell skipped).
        shell:
            init: |
                eval "$(direnv hook ${SHELL_NAME})"
            fish:
                init: |
                    direnv hook fish | source
            sh: {}
        plan:
            # The shell wiring the shell: block produces is VENUE-SHAPED, so each half is
            # asserted at the venue that emits it (deploykit.CompileShellSnippetSteps →
            # shellSnippetDestination; sdk/kit/walk.go:walkShellSnippet):
            #   container image (`charly box build`) → /etc/profile.d/charly-direnv-<shell>.sh
            #                                         + /etc/fish/conf.d/charly-direnv.fish
            #   `target: local` / `target: vm`       → managed blocks in ~/.bashrc / ~/.zshrc
            #                                         + ~/.config/fish/conf.d/charly-direnv.fish
            # The image half is a BUILD artifact, hence `context: [build]` (the documented
            # rule: .dsh/skills/check/references/beds-and-r10.md:661). The machine half is
            # asserted at `context: [runtime]` — the LIVE context; a `check:` step scoped
            # `context: [deploy]` is active in NEITHER check mode (opencharly/opencharly#413).
            # An unscoped `check:` step runs in BOTH modes, so an image-shaped assertion
            # red-blocks every `local:` / vm venue that composes the candy
            # (opencharly/layer-direnv#7, measured on distro-arch#52's bed).
            - check: the direnv binary is installed at /usr/bin/direnv for the .envrc/.secrets autoload workflow
              file:
                file: /usr/bin/direnv
                exists: true
            - check: direnv reports its version without error
              exit_status: 0
              command: /usr/bin/direnv version
            # --- the container-image half: the drop-ins `charly box build` bakes ---
            - check: the bash shell-init drop-in EVALs the direnv hook, guarded to bash only (the guard stops bash from running the zsh drop-in, which /etc/profile also sources)
              context:
                - build
              file:
                # candy name is direnv, not layer-direnv — the shell: schema emits charly-direnv-*
                file: /etc/profile.d/charly-direnv-bash.sh
                exists: true
                contains:
                    - 'eval "$(direnv hook bash)"'
                    - "BASH_VERSION"
            - check: the zsh shell-init drop-in EVALs the direnv zsh hook, guarded to zsh only
              context:
                - build
              file:
                file: /etc/profile.d/charly-direnv-zsh.sh
                exists: true
                contains:
                    - 'eval "$(direnv hook zsh)"'
                    - "ZSH_VERSION"
            - check: NO sh drop-in is baked — `direnv hook sh` is not a valid target, so the sh:{} opt-out must suppress /etc/profile.d/charly-direnv-sh.sh (a file here means the invalid hook ships and errors on every sh)
              id: direnv-no-sh-dropin
              context:
                - build
              exit_status: 0
              command: test ! -e /etc/profile.d/charly-direnv-sh.sh
            - check: the zsh drop-in is guarded to zsh — sourcing it under bash must produce zero errors (the zsh body uses zsh-only syntax, so an unguarded drop-in errors under bash; this is the observable cross-shell regression)
              id: direnv-zsh-guard-inert-under-bash
              context:
                - build
              stdout:
                - equals: "0"
              command: bash -c '. /etc/profile.d/charly-direnv-zsh.sh 2>&1' | grep -cE 'not found|syntax error|unknown target' || true
            - check: the fish shell-init drop-in is baked into its conf.d and sources the direnv fish hook
              context:
                - build
              file:
                file: /etc/fish/conf.d/charly-direnv.fish
                exists: true
                contains:
                    - "direnv hook fish"
            # --- the machine half: what a `local:` / vm venue's own deploy writes ---
            - check: the direnv hook is wired at the DEPLOY venue — an image venue carries the baked drop-ins, a host/VM venue carries the managed ~/.bashrc + ~/.zshrc blocks and the per-user fish conf.d drop-in, and the sh:{} opt-out holds at both. The venue marker picks the branch, so a venue with NO wiring fails either way.
              id: direnv-hook-wired-at-venue
              context:
                - runtime
              exit_status: 0
              stdout:
                - contains: "direnv hook wired at the"
              command: |
                # The venue marker: only the image emitter writes /etc/profile.d drop-ins.
                missing=""
                need() { # need <file> <required-substring>
                  if [ ! -f "$1" ]; then missing="$missing $1(file absent)"; return 0; fi
                  if ! grep -qF "$2" "$1"; then missing="$missing $1(no $2)"; fi
                }
                if [ -e /etc/profile.d/charly-direnv-bash.sh ]; then
                  venue=image
                  need /etc/profile.d/charly-direnv-bash.sh 'eval "$(direnv hook bash)"'
                  need /etc/profile.d/charly-direnv-zsh.sh 'eval "$(direnv hook zsh)"'
                  need /etc/fish/conf.d/charly-direnv.fish 'direnv hook fish'
                  [ ! -e /etc/profile.d/charly-direnv-sh.sh ] || missing="$missing /etc/profile.d/charly-direnv-sh.sh(invalid sh hook)"
                else
                  venue=host
                  need "$HOME/.bashrc" '# opencharly:begin direnv'
                  need "$HOME/.bashrc" 'eval "$(direnv hook bash)"'
                  need "$HOME/.zshrc" '# opencharly:begin direnv'
                  need "$HOME/.zshrc" 'eval "$(direnv hook zsh)"'
                  need "$HOME/.config/fish/conf.d/charly-direnv.fish" 'direnv hook fish'
                  if [ -f "$HOME/.profile" ] && grep -qF 'direnv hook sh' "$HOME/.profile"; then
                    missing="$missing $HOME/.profile(invalid sh hook)"
                  fi
                fi
                if [ -n "$missing" ]; then
                  echo "direnv hook NOT wired at the ${venue} venue:$missing"
                  exit 1
                fi
                echo "direnv hook wired at the ${venue} venue"
            - check: package=direnv
              id: direnv-package
              package:
                package: direnv
                installed: true
            - check: command=/usr/bin/direnv version
              id: direnv-version
              exit_status: 0
              stdout:
                - matches: "[0-9]+\\.[0-9]+"
              command: /usr/bin/direnv version

direnv-skill:
    skill:
        name: direnv
        family: coder
        owner: direnv
        description: |-
            direnv -- automatic environment variable loading from .envrc files.
            Use when working with direnv, .envrc, .secrets, or environment management.
        content: |-
            # direnv -- Automatic environment variable loading
            
            ## Candy Properties
            
            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (packages only) |
            
            ## Packages
            
            RPM: `direnv` · PAC: `direnv` · DEB: `direnv` — full cross-distro parity.
            
            ## Usage
            
            ```yaml
            # charly.yml
            my-image:
              candy:
                - direnv
            ```
            
            Typically used as part of the `agent-forwarding` composition candy rather than directly. Also available in the heavyweight `dev-tools` candy.
            
            ## Runtime Behavior
            
            Provides the `direnv` binary AND the per-shell hook installation for automatic environment variable loading from `.envrc` files.
            
            **Shell hooks are declarative.** The candy carries a `shell:` block:
            
            ```yaml
            shell:
              init: |
                eval "$(direnv hook ${SHELL_NAME})"   # bash/zsh — POSIX-style
              fish:
                init: |
                  direnv hook fish | source            # fish — different syntax
              sh: {}                                   # sh opted OUT — direnv has no sh hook
            ```
            
            The emitter is VENUE-SHAPED. Container images get `/etc/profile.d/charly-direnv-<shell>.sh` (bash/zsh only) and `/etc/fish/conf.d/charly-direnv.fish` emitted at `charly box build` time; each POSIX drop-in is runtime-guarded to its own shell because `/etc/profile` sources every `*.sh` in every POSIX login shell. `target: local` host and `target: vm` guest deploys instead get a managed block in `~/.bashrc` / `~/.zshrc` plus `~/.config/fish/conf.d/charly-direnv.fish` written at `charly deploy add` time — for every shell the `shell:` block defines, with no per-host shell probe. The fish hook lands in the per-user conf.d drop-in (its own file), so it works without editing `~/.config/fish/config.fish`.
            
            **The plan asserts each venue's OWN shape.** The baked drop-ins are `context: [build]` assertions (`charly box build` artifacts); the deploy venue's wiring is one `context: [runtime]` assertion — the live mode's context, because a `check:` step scoped `context: [deploy]` is active in NEITHER check mode (`opencharly/opencharly#413`). That runtime step branches on the venue marker (`/etc/profile.d/charly-direnv-bash.sh`): an image venue must carry the baked drop-ins, a host/VM venue must carry the managed `~/.bashrc` / `~/.zshrc` blocks and the per-user fish drop-in, and the `sh:{}` opt-out must hold at both. An unscoped image-shaped assertion run in a `local:` venue is exactly the defect this shape prevents (`opencharly/layer-direnv#7`).
            
            The primary use case in OpenCharly is the `.secrets` workflow: `.envrc` calls `eval "$(charly secrets gpg env)"` which decrypts a GPG-encrypted `.secrets` file in memory and exports the variables — no plaintext on disk. No external `direnvrc` dependency needed.
            
            ## Used In Boxes
            
            Part of `agent-forwarding` composition candy, used in application boxes.
            
            Also available in the `dev-tools` candy.
            
            ## Related Candies
            
            - `/charly-distros:agent-forwarding` -- metalayer that includes gnupg + direnv + ssh-client
            - `/charly-infrastructure:gnupg` -- GPG tools (needed for `.secrets` decryption)
            - `/charly-coder:dev-tools` -- heavyweight candy that also includes direnv
            
            ## Cross-References
            
            - `/charly-build:secrets` -- `charly secrets gpg` commands for managing `.secrets` files, `charly secrets gpg setup` for GPG agent + KeePassXC configuration, `charly secrets gpg doctor` for health checks
            
            ## When to Use This Skill
            
            Use when the user asks about:
            
            - direnv or `.envrc` files
            - The `direnv` candy
            - Automatic environment variable loading
            - The `.secrets` + direnv workflow
            
            ## Related
            
            - `/charly-image:layer` — candy authoring reference (`charly.yml` schema, task verbs, service declarations)
            - `/charly-check:check` — declarative testing (`check:` block, `charly check box`, `charly check live`)
